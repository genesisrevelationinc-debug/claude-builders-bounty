name: 'Claude Code PR Reviewer'
description: 'A GitHub Action that uses Claude Code to review PRs and post structured comments'
author: 'Claude Builder'

inputs:
  github-token:
    description: 'GitHub token for accessing pull requests'
    required: true
  claude-api-key:
    description: 'Claude API key for code analysis'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Run Claude Review
      run: |
        echo "Running Claude Code PR review..."
        node src/action.js
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CLAUDE_API_KEY: ${{ inputs.claude-api-key }}

branding:
  icon: 'code'
  color: 'blue'