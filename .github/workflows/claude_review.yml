name: Claude Code PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install PyGithub openai requests

      - name: Run Claude Code PR Review
        run: |
          python claude-review --pr ${{ github.event.pull_request.html_url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Comment on PR with analysis
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude_code_analysis
          message: |
            ${{ steps.claude.outputs.analysis }}
    outputs:
      pr_number: ${{ steps.extract_pr_number.outputs.pr_number }}
      claude_analysis: ${{ steps.cla