from dataclasses import dataclass
from typing import Optional

import requests


@dataclass
class ReviewResult:
    """Structured review result."""
    summary: str
    risks: list[str]
    suggestions: list[str]
    confidence: str


def fetch_pr_diff(pr_url: str) -> str:
    """Fetch PR diff from GitHub API."""
    # Extract owner, repo, PR number from URL
    match = re.match(r"https://github\.com/([^/]+)/([^/]+)/pull/(\d+)", pr_url)
    if not match:
        raise ValueError(f"Invalid PR URL: {pr_url}")

    owner, repo, pr_number = match.groups()

    # Try to get token from environment
    token = os.environ.get("GITHUB_TOKEN")
    headers = {}
    if token:
        headers["Authorization"] = f"token {token}"

    api_url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    response = requests.get(api_url, headers=headers, timeout=30)
    response.raise_for_status()

    pr_data = response.json()
    diff_url = pr_data.get("diff_url")

    diff_response = requests.get(diff_url, headers=headers, timeout=30)
    diff_response.raise_for_status()

    return diff_response.text


def call_claude_api(diff_text: str) -> ReviewResult:
    """Call Claude API to analyze the diff."""
    api_key = os.environ.get("ANTHROPIC_API_KEY")
    if not api_key:
        raise ValueError("ANTHROPIC_API_KEY environment variable not set")

    # Truncate diff if too long (Claude has context limits)
    max_diff_chars = 100000
    if len(diff_text) > max_diff_chars:
