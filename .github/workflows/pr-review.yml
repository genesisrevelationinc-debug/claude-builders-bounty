name: Claude Code PR Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: startsWith(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Extract PR URL
        id: extract
        run: |
          # Extract PR URL from comment or use the PR that was commented on
          echo "PR_URL=https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}" >> $GITHUB_ENV
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run PR Review
        run: |
          python -m pr_reviewer.cli --pr ${{ env.PR_URL }}