Please respond in exactly this format:

## Summary
[2-3 sentence summary of the changes]

## Risks
- [Risk 1]
- [Risk 2]
- [Risk 3 or more if applicable, or "None identified" if no risks]

## Suggestions
- [Suggestion 1]
- [Suggestion 2]
- [Suggestion 3 or more if applicable, or "None" if no suggestions]

## Confidence
[Low / Medium / High]

Rules:
- Summary must be 2-3 sentences describing what the PR does.
- Risks should list potential bugs, security issues, performance problems, or maintainability concerns.
- Suggestions should be actionable improvements.
- Confidence reflects how certain you are about your assessment based on the diff quality and completeness.
- Be concise but thorough.

