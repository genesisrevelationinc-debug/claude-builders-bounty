name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r claude-review/requirements.txt

      - name: Run Claude PR Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python -m claude-review.claude_review \
            --pr "$PR_URL" \
            --post-comment
# Claude PR Review Agent 🤖

An intelligent PR review agent powered by Claude that analyzes pull request diffs and posts structured Markdown review comments.

## Features

- **Structured Reviews**: Generates consistent, well-formatted review comments
- **Risk Assessment**: Identifies potential issues and categorizes them by severity
- **Actionable Suggestions**: Provides concrete improvement recommendations
- **Confidence Scoring**: Rates review reliability as Low / Medium / High
- **Flexible Usage**: Works via CLI or GitHub Actions

## Installation

### Prerequisites

- Python 3.11+
- An Anthropic API key

