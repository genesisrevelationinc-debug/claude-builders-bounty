"""Command-line interface for Claude PR Review."""

import argparse
import sys

from .reviewer import review_pr


def main():
    parser = argparse.ArgumentParser(
        description="Claude Code PR Review Agent",
        formatter_class=argparse.RawDescriptionHelpFormatter,
        epilog="""
Examples:
  claude-review --pr https://github.com/owner/repo/pull/123
  claude-review --pr https://github.com/owner/repo/pull/123 --post-comment
        """,
    )
    parser.add_argument(
        "--pr",
        required=True,
        help="URL of the GitHub PR to review (e.g., https://github.com/owner/repo/pull/123)",
    )
    parser.add_argument(
        "--post-comment",
        action="store_true",
        help="Post the review as a comment on the PR (requires GITHUB_TOKEN env var)",
    )
    parser.add_argument(
        "--output",
        "-o",
        help="Write review to a file instead of stdout",
    )

    args = parser.parse_args()

    try:
        review = review_pr(args.pr, post_comment=args.post_comment, output_file=args.output)
        if not args.output:
            print(review)
    except Exception as e:
        print(f"Error: {e}", file=sys.stderr)
        sys.exit(1)


if __name__ == "__main__":
    main()
"""Core PR review logic using Claude API and GitHub."""

import os
import re
import sys
from typing import Optional

import requests


def extract_pr_info(pr_url: str) -> tuple[str, str, int]:
    """Extract owner, repo, and PR number from a GitHub PR URL."""
    pattern = r"github\.com/([^/]+)/([^/]+)/pull/(\d+)"
    match = re.search(pattern, pr_url)
    if not match:
        raise ValueError(f"Invalid GitHub PR URL: {pr_url}")
    return match.group(1), match.group(2), int(match.group(3))


def fetch_pr_diff(owner: str, repo: str, pr_number: int, token: str) -> str:
    """Fetch the PR diff from GitHub API."""
    url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3.diff",
    }
    response = requests.get(url, headers=headers, timeout=30)
    response.raise_for_status()
    return response.text


def fetch_pr_details(owner: str, repo: str, pr_number: int, token: str) -> dict:
    """Fetch PR details (title, description) from GitHub API."""
    url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3+json",
    }
    response = requests.get(url, headers=headers, timeout=30)
    response.raise_for_status()
    return response.json()


