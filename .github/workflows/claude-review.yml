# This workflow will run the claude-review script on pull request

name: Claude Code PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code PR Review
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install requests
          pip install openai
      
      - name: Run Claude Code Review
        run: |
          python claude-review --pr ${{ github.event.pull_request.html_url }}