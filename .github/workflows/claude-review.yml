name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r claude-review/requirements.txt

      - name: Run Claude PR Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m claude-review.claude_review \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --output review.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            const { data: comment } = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });
            console.log('Posted review comment:', comment.html_url);
--- /dev/null
# Claude PR Review Agent 🤖

> A Claude Code sub-agent that reviews GitHub PRs and posts structured Markdown comments.

## Features

- **CLI usage**: Run locally with `claude-review --pr <url>`
- **GitHub Action**: Auto-reviews PRs on open/synchronize
- **Structured output**: Summary, risks, suggestions, and confidence score
- **Powered by Claude**: Uses Anthropic's Claude API for intelligent analysis

