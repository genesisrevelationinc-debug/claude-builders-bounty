# This workflow will run the Claude Code PR reviewer on pull requests

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Claude Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Save the claude-review script to a file
          curl -s https://raw.githubusercontent.com/claudio-b/claude-review/main/claude-review -o claude-review
          chmod +x claude-review
          python claude-review --pr "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}