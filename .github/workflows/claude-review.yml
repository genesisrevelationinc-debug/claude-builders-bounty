name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Claude Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Save the script
          curl -s https://raw.githubusercontent.com/claude-builders-bounty/claude-builders-bounty/main/claude-review -o claude-review
          chmod +x claude-review
          
          # Run review on the PR
          python claude-review --pr "https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}