name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r claude-review/requirements.txt

      - name: Get PR diff
        id: get-diff
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.pull_request.diff_url }}" > /tmp/pr.diff

      - name: Run Claude Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          cd claude-review
          python -m claude_review --pr "$PR_URL" --diff-file /tmp/pr.diff --post-comment
--- /dev/null
# Claude PR Review Agent 🤖

An autonomous sub-agent for [Claude Code](https://claude.ai/code) that reviews GitHub PRs and posts structured Markdown review comments.

## Features

- **Structured output**: Summary, risks, suggestions, and confidence score
- **CLI usage**: Run locally with `claude-review --pr <url>`
- **GitHub Action**: Auto-reviews PRs on open/synchronize
- **Smart analysis**: Powered by Claude 3.5 Sonnet via Anthropic API

