#!/usr/bin/env python3
"""
Claude PR Review Agent

A Claude Code sub-agent that reviews a PR diff, analyzes it,
and returns a structured Markdown review comment.
"""

import argparse
import os
import re
import sys
from dataclasses import dataclass
from typing import List, Optional

import requests


@dataclass
class PRReview:
    """Structured PR review output."""
    summary: str
    risks: List[str]
    suggestions: List[str]
    confidence: str  # Low, Medium, High


def get_pr_diff(pr_url: str, github_token: Optional[str] = None) -> str:
    """Fetch the PR diff from GitHub."""
    # Parse PR URL to extract owner, repo, and PR number
    match = re.match(r"https://github\.com/([^/]+)/([^/]+)/pull/(\d+)", pr_url)
    if not match:
        raise ValueError(f"Invalid PR URL: {pr_url}")
    
    owner, repo, pr_number = match.groups()
    
    headers = {
        "Accept": "application/vnd.github.v3.diff",
        "X-GitHub-Api-Version": "2022-11-28",
    }
    
    if github_token:
        headers["Authorization"] = f"Bearer {github_token}"
    
    api_url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    
    response = requests.get(api_url, headers=headers, timeout=30)
    response.raise_for_status()
    
    return response.text


def get_pr_info(pr_url: str, github_token: Optional[str] = None) -> dict:
    """Fetch PR metadata from GitHub API."""
    match = re.match(r"https://github\.com/([^/]+)/([^/]+)/pull/(\d+)", pr_url)
    if not match:
        raise ValueError(f"Invalid PR URL: {pr_url}")
    
    owner, repo, pr_number = match.groups()
    
    headers = {
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
    }
    
    if github_token:
        headers["Authorization"] = f"Bearer {github_token}"
    
    api_url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    
    response = requests.get(api_url, headers=headers, timeout=30)
    response.raise_for_status()
    
    return response.json()


