name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'GitHub PR URL to review (optional for manual trigger)'
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Claude Review
        run: |
          # Download and setup claude-review script
          curl -o claude-review https://raw.githubusercontent.com/claude-builders-bounty/claude-builders-bounty/main/claude-review
          chmod +x claude-review
          
          # Run review on PR
          if [ -n "${{ github.event.inputs.pr_url }}" ]; then
            ./claude-review --pr "${{ github.event.inputs.pr_url }}"
          else
            ./claude-review --pr "${{ github.event.pull_request.url }}"
          fi
          
      - name: Post review comment
        run: |
          # This would normally post the review as a PR comment
          # Implementation depends on GitHub API access
          echo "Review completed"