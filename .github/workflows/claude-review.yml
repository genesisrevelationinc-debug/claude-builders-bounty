"""CLI entry point for the Claude PR Review agent."""

import argparse
import os
import sys

from .reviewer import ClaudeReviewer


def create_parser() -> argparse.ArgumentParser:
    parser = argparse.ArgumentParser(
        prog="claude-review",
        description="Claude Code PR Review Agent — analyze a PR and produce structured Markdown output.",
    )
    parser.add_argument(
        "--pr",
        required=True,
        help="URL of the GitHub pull request to review (e.g. https://github.com/owner/repo/pull/123)",
    )
    parser.add_argument(
        "--diff",
        default=None,
        help="Path to a local .diff file (optional; fetched from GitHub if omitted)",
    )
    parser.add_argument(
        "--api-key",
        default=os.environ.get("ANTHROPIC_API_KEY"),
        help="Anthropic API key (defaults to ANTHROPIC_API_KEY env var)",
    )
    parser.add_argument(
        "--model",
        default="claude-3-5-sonnet-20241022",
        help="Claude model to use (default: claude-3-5-sonnet-20241022)",
    )
    parser.add_argument(
        "--output",
        "-o",
        default=None,
        help="Write review to this file instead of stdout",
    )
    parser.add_argument(
        "--post-comment",
        action="store_true",
        help="Post the review as a GitHub PR comment (requires --github-token)",
    )
    parser.add_argument(
        "--github-token",
        default=os.environ.get("GITHUB_TOKEN"),
        help="GitHub token for posting comments (defaults to GITHUB_TOKEN env var)",
    )
    return parser


def main() -> None:
    parser = create_parser()
    args = parser.parse_args()

    if not args.api_key:
        parser.error("Anthropic API key required. Set ANTHROPIC_API_KEY or pass --api-key.")

    reviewer = ClaudeReviewer(api_key=args.api_key, model=args.model)

    try:
        review = reviewer.review(pr_url=args.pr, diff_path=args.diff)
    except Exception as exc:
        print(f"Error: {exc}", file=sys.stderr)
        sys.exit(1)

    if args.output:
        with open(args.output, "w", encoding="utf-8") as fh:
            fh.write(review.markdown)
        print(f"Review written to {args.output}")
    else:
        print(review.markdown)

    if args.post_comment:
        if not args.github_token:
            parser.error("--post-comment requires --github-token")
        review.post_comment(pr_url=args.pr, token=args.github_token)
        print("Review posted as PR comment.")
"""Core review logic for the Claude PR Review agent."""

