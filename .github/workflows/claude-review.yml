name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    name: Claude Code PR Review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r claude-review/requirements.txt

      - name: Get PR diff
        id: get-diff
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            | jq -r '.diff_url' | xargs curl -s > pr.diff
          echo "diff_file=pr.diff" >> $GITHUB_OUTPUT

      - name: Run Claude Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python claude-review/claude_review.py \
            --pr ${{ github.event.pull_request.html_url }} \
            --diff-file pr.diff \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --post-comment

#!/usr/bin/env python3
"""
Claude Code PR Review Agent

A CLI tool that takes a PR diff as input, analyzes it using Claude,
and returns a structured Markdown review comment.

Usage:
    claude-review --pr https://github.com/owner/repo/pull/123
    claude-review --pr https://github.com/owner/repo/pull/123 --diff-file path/to/diff
    claude-review --pr URL --github-token TOKEN --post-comment
"""

