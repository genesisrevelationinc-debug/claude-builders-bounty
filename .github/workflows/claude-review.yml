name: Claude Code Review
on:
  pull_request:
    branches: [ main ]
  issue_comment:
    types: [ created ]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Run Claude Review
      run: |
        python claude-review.py --pr ${{ github.event.pull_request.html_url }}