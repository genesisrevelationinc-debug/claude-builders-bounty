name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r claude-review/requirements.txt

      - name: Run Claude Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python -m claude-review.claude_review \
            --pr "$PR_URL" \
            --pr-number "$PR_NUMBER" \
            --repo-owner "$REPO_OWNER" \
            --repo-name "$REPO_NAME"
--- /dev/null
# Claude PR Review Agent 🤖

An AI-powered PR reviewer that uses Claude to analyze pull requests and post structured Markdown review comments.

## Features

- **Structured Analysis**: Generates consistent, well-formatted review comments
- **Risk Assessment**: Identifies potential issues with confidence scoring
- **Actionable Suggestions**: Provides concrete improvement recommendations
- **Flexible Usage**: Works via CLI or GitHub Actions

## Installation

### Prerequisites

- Python 3.11+
- An Anthropic API key

