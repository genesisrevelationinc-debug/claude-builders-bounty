@dataclass
class ReviewResult:
    """Structured PR review result."""

    summary: str
    risks: list[str]
    suggestions: list[str]
    confidence: str  # Low, Medium, High


def get_pr_diff_from_url(pr_url: str) -> str:
    """Fetch PR diff from GitHub API."""
    # Parse PR URL to extract owner, repo, and PR number
    match = re.match(r"https?://github\.com/([^/]+)/([^/]+)/pull/(\d+)", pr_url)
    if not match:
        raise ValueError(f"Invalid GitHub PR URL: {pr_url}")

    owner, repo, pr_number = match.groups()

    # Try to get diff using gh CLI first
    try:
        result = subprocess.run(
            ["gh", "api", f"repos/{owner}/{repo}/pulls/{pr_number}"],
            capture_output=True,
            text=True,
            check=True,
            timeout=30,
        )
        pr_data = json.loads(result.stdout)
        diff_url = pr_data.get("diff_url")
        if diff_url:
            diff_result = subprocess.run(
                ["curl", "-s", "-L", "-H", "Accept: application/vnd.github.v3.diff", diff_url],
                capture_output=True,
                text=True,
                check=True,
                timeout=30,
            )
            return diff_result.stdout
    except (subprocess.CalledProcessError, FileNotFoundError, json.JSONDecodeError):
        pass

    # Fallback to direct API call with requests
    if requests is None:
        raise ImportError("requests library required. Install with: pip install requests")

    headers = {
        "Accept": "application/vnd.github.v3.diff",
        "User-Agent": "claude-review/0.1.0",
    }

    # Add auth token if available
    token = os.environ.get("GITHUB_TOKEN") or os.environ.get("GH_TOKEN")
    if token:
        headers["Authorization"] = f"token {token}"

    api_url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
    response = requests.get(api_url, headers=headers, timeout=30)
    response.raise_for_status()

    # The diff is returned directly in the response body for v3.diff accept header
    return response.text


def read_diff_file(diff_path: str) -> str:
    """Read diff from a local file."""
    with open(diff_path, "r", encoding="utf-8") as f:
        return f.read()


