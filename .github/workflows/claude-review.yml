import argparse
import os
import re
import subprocess
import sys
import tempfile
from dataclasses import dataclass
from pathlib import Path
from typing import Optional

import requests


@dataclass
class ReviewResult:
    """Structured PR review result."""

    summary: str
    risks: list[str]
    suggestions: list[str]
    confidence: str


class ClaudeReviewer:
    """PR reviewer using Claude API."""

    API_URL = "https://api.anthropic.com/v1/messages"

    def __init__(self, api_key: Optional[str] = None):
        self.api_key = api_key or os.environ.get("ANTHROPIC_API_KEY")
        if not self.api_key:
            raise ValueError(
                "ANTHROPIC_API_KEY must be set or passed to ClaudeReviewer"
            )

    def _call_claude(self, prompt: str, max_tokens: int = 4000) -> str:
        """Call the Claude API with the given prompt."""
        headers = {
            "x-api-key": self.api_key,
            "anthropic-version": "2023-06-01",
            "content-type": "application/json",
        }
        payload = {
            "model": "claude-3-5-sonnet-20241022",
            "max_tokens": max_tokens,
            "messages": [
                {
                    "role": "user",
                    "content": prompt,
                }
            ],
        }

        response = requests.post(self.API_URL, headers=headers, json=payload, timeout=120)
        response.raise_for_status()
        return response.json()["content"][0]["text"]

    def fetch_pr_diff(self, pr_url: str) -> str:
        """Fetch the diff for a GitHub PR."""
        # Convert PR URL to diff URL
        diff_url = pr_url.replace("github.com", "api.github.com/repos")
        diff_url = diff_url.replace("/pull/", "/pulls/")
        diff_url = f"{diff_url}.diff"

        headers = {}
        github_token = os.environ.get("GITHUB_TOKEN")
        if github_token:
            headers["Authorization"] = f"token {github_token}"

        response = requests.get(diff_url, headers=headers, timeout=30)
        response.raise_for_status()
        return response.text

    def analyze_diff(self, diff: str) -> ReviewResult:
        """Analyze a PR diff using Claude and return structured review."""
        # Truncate very large diffs
        max_diff_length = 100000
        if len(diff) > max_diff_length:
            diff = diff[:max_diff_length] + "\n\n[... diff truncated due to size ...]"

