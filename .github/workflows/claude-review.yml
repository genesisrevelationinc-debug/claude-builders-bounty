"""Claude Code PR Review Agent.

Analyzes a PR diff and produces a structured Markdown review comment.
"""

import argparse
import json
import os
import re
import sys
from dataclasses import dataclass
from typing import Optional

import requests


@dataclass
class ReviewResult:
    """Structured review result."""

    summary: str
    risks: list[str]
    suggestions: list[str]
    confidence: str


class ClaudeReviewer:
    """Claude Code PR Reviewer using Anthropic's API."""

    API_URL = "https://api.anthropic.com/v1/messages"

    def __init__(self, api_key: Optional[str] = None):
        self.api_key = api_key or os.environ.get("ANTHROPIC_API_KEY")
        if not self.api_key:
            raise ValueError(
                "Anthropic API key required. Set ANTHROPIC_API_KEY environment variable."
            )

    def _call_claude(self, prompt: str, max_tokens: int = 4000) -> str:
        """Call Claude API with the given prompt."""
        headers = {
            "x-api-key": self.api_key,
            "anthropic-version": "2023-06-01",
            "content-type": "application/json",
        }

        payload = {
            "model": "claude-3-5-sonnet-20241022",
            "max_tokens": max_tokens,
            "messages": [{"role": "user", "content": prompt}],
        }

        response = requests.post(self.API_URL, headers=headers, json=payload, timeout=120)
        response.raise_for_status()

        data = response.json()
        return data["content"][0]["text"]

    def fetch_pr_diff(self, pr_url: str) -> str:
        """Fetch the diff for a GitHub PR."""
        # Convert PR URL to diff URL
        diff_url = pr_url.replace("github.com", "api.github.com/repos").replace(
            "/pull/", "/pulls/"
        )

        headers = {
            "Accept": "application/vnd.github.v3.diff",
            "User-Agent": "claude-review/0.1.0",
        }

        # Add auth if token available
        github_token = os.environ.get("GITHUB_TOKEN")
        if github_token:
            headers["Authorization"] = f"token {github_token}"

        response = requests.get(diff_url, headers=headers, timeout=30)
        response.raise_for_status()

        return response.text

    def analyze_diff(self, diff: str) -> ReviewResult:
        """Analyze a PR diff and return structured review."""
        # Truncate very large diffs
        max_diff_length = 150000
        if len(diff) > max_diff_length:
            diff = diff[:max_diff_length] + "\n\n[... diff truncated due to size ...]"

